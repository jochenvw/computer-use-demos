<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Epic API Tester</title><script>(() => { const param = new URLSearchParams(window.location.search).get('scoutTheme'); const theme = param || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', theme); })();</script><style>
:root { color-scheme:light; --cp-bg:#f7f4ef; --cp-bg-elevated:#fcfbf8; --cp-surface:#ffffff; --cp-surface-soft:#f5f5f5; --cp-border:#dedede; --cp-border-strong:#919191; --cp-text:#242424; --cp-text-muted:#5c5c5c; --cp-text-soft:#6f6f6f; --cp-accent:#b11f4b; --cp-accent-hover:#9a1a41; --cp-accent-soft:rgba(177,31,75,0.08); --cp-accent-fg:#ffffff; --cp-success:#16a34a; --cp-danger:#dc2626; --cp-warning:#f59e0b; --cp-link:#0078d4; --cp-shadow:0 18px 48px rgba(0,0,0,0.12); --cp-overlay:rgba(255,255,255,0.8); --cp-panel:rgba(255,255,255,0.86); --cp-panel-strong:rgba(255,255,255,0.96); --cp-sheen:rgba(255,255,255,0.55); --cp-highlight:rgba(177,31,75,0.12); }
html[data-theme="dark"] { color-scheme:dark; --cp-bg:#3d3b3a; --cp-bg-elevated:#343231; --cp-surface:#292929; --cp-surface-soft:#2e2e2e; --cp-border:#474747; --cp-border-strong:#5f5f5f; --cp-text:#dedede; --cp-text-muted:#919191; --cp-text-soft:#b0b0b0; --cp-accent:#fd8ea1; --cp-accent-hover:#fb7b91; --cp-accent-soft:rgba(253,142,161,0.14); --cp-accent-fg:#1a1a1a; --cp-success:#4ade80; --cp-danger:#f87171; --cp-warning:#fbbf24; --cp-link:#4da6ff; --cp-shadow:0 18px 48px rgba(0,0,0,0.32); --cp-overlay:rgba(41,41,41,0.88); --cp-panel:rgba(41,41,41,0.72); --cp-panel-strong:rgba(41,41,41,0.96); --cp-sheen:rgba(255,255,255,0.04); --cp-highlight:rgba(253,142,161,0.12); }
*{box-sizing:border-box}body{margin:0;background:var(--cp-bg);color:var(--cp-text);font:14px "Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:960px;margin:32px auto;padding:0 16px}h1{margin:0 0 4px}p{color:var(--cp-text-muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:16px;padding:16px;margin-top:16px;box-shadow:var(--cp-shadow)}label{display:block;font-weight:600;margin:8px 0 4px}input,select,button{width:100%;border:1px solid var(--cp-border-strong);border-radius:.625rem;padding:8px;background:var(--cp-bg-elevated);color:var(--cp-text)}input[type=checkbox]{width:auto;margin-right:4px}button{width:auto;background:var(--cp-accent);color:var(--cp-accent-fg);border:0;margin:8px 4px 0 0;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.secondary{background:var(--cp-surface-soft);color:var(--cp-text)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--cp-surface-soft);padding:12px;border-radius:.625rem;min-height:80px;font:12px Consolas,"Courier New",Courier,monospace}.ok{color:var(--cp-success)}.bad{color:var(--cp-danger)}a{display:block;color:var(--cp-link);margin-top:8px}
</style></head><body><main><h1>Epic API tester</h1><p><b>files</b> routes the local-file skill; <b>ehr</b> routes the browser skill. Fixture mode is safe by default.</p><section class="card"><div class="grid"><div><label>Tunnel HTTPS URL<input id="url" placeholder="https://…devtunnels.ms"></label></div><div><label>API bearer token<input id="bearer" type="password"></label></div><div><label>Optional tunnel connect token<input id="tunnel" type="password"></label></div><div><label>Patient ID<input id="patient" value="DEMO-100042"></label></div><div><label>Source<select id="source"><option>ehr</option><option>files</option><option>both</option></select></label></div><div><label>Resources<select id="resources" multiple size="5"><option value="patient">patient</option><option value="encounters">encounters</option><option value="observations" selected>observations</option><option value="documents">documents</option><option value="ecg">ecg</option></select></label></div><div><label>Observation codes (optional, comma-separated)<input id="codes" placeholder="85354-9"></label></div><div><label>Output<select id="format"><option value="fhir">FHIR JSON</option><option value="fhir-xml">FHIR XML</option><option value="hl7">HL7</option><option value="json">JSON</option><option value="ndjson">NDJSON</option></select></label></div></div><label><input id="bypass" type="checkbox">Bypass cache (live skill work in Copilot backend)</label><button id="submit">Submit</button><button id="poll" class="secondary">Poll</button><button id="cancel" class="secondary">Cancel polling</button><button id="bp" class="secondary">Quick BP</button><button id="ecg" class="secondary">ECG file</button><button id="clear" class="secondary">Clear connection/secrets</button></section><section class="card"><b id="state">Idle</b><pre id="meta"></pre><pre id="output">Raw response appears here.</pre><div id="files"></div></section></main><script>
let csrf="CSRF_TOKEN",job="",pending=false,timer,controller,generation=0,polls=0,polling=false;const $=id=>document.getElementById(id),ids=["url","bearer","tunnel"];const secrets=()=>({tunnel_url:$("url").value,bearer_token:$("bearer").value,tunnel_token:$("tunnel").value});const set=(s,bad=false)=>{$("state").textContent=s;$("state").className=bad?"bad":"ok";$("submit").disabled=pending};function cancel(message="Cancelled"){generation++;clearTimeout(timer);timer=undefined;controller?.abort();controller=undefined;polling=false;pending=false;$("submit").disabled=false;if(message)set(message)}function clearResults(){$("meta").textContent="";$("output").textContent="Raw response appears here.";$("files").replaceChildren()}async function call(route,data,g){controller=new AbortController;let r=await fetch("/api/"+route,{method:"POST",signal:controller.signal,headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({...secrets(),...data})});let x=await r.json();if(g!==generation)throw new DOMException("Cancelled","AbortError");if(!r.ok)throw Error(x.error||x.body||"Request failed");return x}const selected=()=>[...$("resources").selectedOptions].map(x=>x.value);const render=x=>{try{return JSON.stringify(JSON.parse(x),null,2)}catch{return x}};function files(list,g){$("files").replaceChildren(...list.map(f=>{let a=document.createElement("a");a.href="#";a.textContent="Download "+f.name;a.onclick=async e=>{e.preventDefault();try{let r=await fetch("/api/file",{method:"POST",signal:(controller=new AbortController).signal,headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({...secrets(),job_id:job,file_id:f.file_id})});if(g!==generation)throw new DOMException("Cancelled","AbortError");if(!r.ok){let x=await r.json();throw Error(x.error||"Download failed")}let u=URL.createObjectURL(await r.blob()),d=document.createElement("a");d.href=u;d.download=f.name;d.style.display="none";document.body.append(d);d.click();d.remove();setTimeout(()=>URL.revokeObjectURL(u),0)}catch(e){if(e.name!=="AbortError")set(e.message,true)}};return a}))}async function poll(g=generation){if(g!==generation||!job||polling)return;if(++polls>60){cancel("Polling timed out");return}polling=true;set("Running");try{let x=await call("status",{job_id:job},g),b=JSON.parse(x.body);if(g!==generation)return;$("meta").textContent=render(x.body);if(b.status==="failed"){cancel("Failed");return}if(b.status==="complete"){let z=await call("result",{job_id:job,format:$("format").value},g);if(g!==generation)return;$("output").textContent=render(z.body);$("meta").textContent+="\n"+render(JSON.stringify(z.headers));if($("format").value==="json")files(JSON.parse(z.body).files||[],g);pending=false;$("submit").disabled=false;set("Complete");return}timer=setTimeout(()=>{timer=undefined;poll(g)},1000)}catch(e){if(e.name!=="AbortError"&&g===generation)cancel(e.message)}finally{polling=false}}$("submit").onclick=async()=>{cancel();let g=generation;pending=true;polls=0;clearResults();set("Connecting");try{let request={patient_id:$("patient").value,source:$("source").value,resources:selected(),bypass_cache:$("bypass").checked},codes=$("codes").value.split(",").map(x=>x.trim()).filter(Boolean);if(codes.length)request.observation_codes=codes;let x=await call("jobs",{request},g);if(g!==generation)return;job=JSON.parse(x.body).job_id;set("Submitted");poll(g)}catch(e){if(e.name!=="AbortError"&&g===generation)cancel(e.message)}};$("poll").onclick=()=>{if(job&&!timer&&pending&&!polling)poll(generation)};$("cancel").onclick=()=>cancel();$("bp").onclick=()=>{$("source").value="ehr";$("resources").value="observations";$("codes").value="85354-9";$("bypass").checked=false};$("ecg").onclick=()=>{$("source").value="files";$("resources").value="ecg";$("codes").value=""};$("clear").onclick=()=>{cancel("Idle");ids.forEach(x=>$(x).value="");job="";$("codes").value="";clearResults()};addEventListener("pagehide",()=>$("clear").click());
</script></body></html>
