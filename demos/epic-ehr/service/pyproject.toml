[project]
name = "epic-ehr-data-adapter-demo"
version = "0.2.0"
description = "Authenticated clinical-data API backed by synthetic fixtures or a guarded computer-use worker"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.20.0",
    "fastapi>=0.115.0",
    "github-copilot-sdk==1.0.13",
    "playwright>=1.51.0",
    "pypdf>=6.0.0",
    "rich>=13.9.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
epic-agent = "epic_adapter.console:main"

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epic_adapter"]
