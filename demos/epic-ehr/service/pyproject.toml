[project]
name = "epic-ehr-data-adapter-demo"
version = "0.3.0"
description = "Authenticated clinical-data API backed by synthetic fixtures or a guarded computer-use worker"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "github-copilot-sdk==1.0.13",
    "playwright>=1.63.0",
    "pypdf>=6.18.0",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
epic-agent = "epic_adapter.console:main"
epic-tester = "epic_adapter.tester:main"

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epic_adapter"]
artifacts = ["src/epic_adapter/static/tester.html"]
