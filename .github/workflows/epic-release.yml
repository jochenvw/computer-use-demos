name: Epic versioned release

on:
  push:
    tags:
      - "epic-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing epic-v* tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Validate service
        shell: pwsh
        run: |
          uv sync --project .\demos\epic-ehr\service --locked --extra test --default-index https://pypi.org/simple
          uv run --project .\demos\epic-ehr\service --frozen --extra test python -m unittest discover .\demos\epic-ehr\service\tests -v
          uv build .\demos\epic-ehr\service --wheel --out-dir .\dist\wheel

      - name: Build release archive
        shell: pwsh
        run: |
          .\demos\epic-ehr\release\build-release.ps1 -Tag $env:RELEASE_TAG -OutputDirectory .\dist

      - uses: sigstore/cosign-installer@v3.10.0

      - name: Sign release archive with GitHub OIDC
        shell: pwsh
        run: |
          $archive = ".\dist\epic-ehr-$env:RELEASE_TAG-windows-x64.zip"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" $archive

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = ".\dist\epic-ehr-$env:RELEASE_TAG-windows-x64.zip"
          $bundle = "$archive.sigstore.json"
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive $bundle --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive $bundle --verify-tag --generate-notes --title "Epic Retrieval Agent $env:RELEASE_TAG"
          }
